version: '3.8'

services:
  trueforge-server:
    image: ghcr.io/truefoundry/trueforge:latest
    container_name: sih26149-trueforge-server
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      - PORT=8790
      - STANDALONE=false
      - DATABASE_URL=postgres://trueforge:trueforge_pass@postgres:5432/trueforge_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sih26149-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trueforge
      POSTGRES_PASSWORD: trueforge_pass
      POSTGRES_DB: trueforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueforge -d trueforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih26149-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
